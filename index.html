<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fantasy Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060b; --panel:#121118; --panel2:#1a1922; --line:#2a2833; --text:#f4f3f7; --muted:#9a98a6;
  --accent:#ff7a1a; --teal:#35e0c8; --green:#3ddc84; --red:#ff5a6a; --gold:#ffd166;
  --card:#0b0a10; --cardline:#e8e6f0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 24px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff7a1a,#ff3d81);display:grid;place-items:center;font-weight:800}
.brand h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.hbtns{display:flex;gap:8px}
.pill{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.pill:active{transform:scale(.97)}
.pill.icon{padding:8px 11px;font-size:16px}
.spin{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.imp{margin:4px 0 12px;padding:12px;border:1px dashed #4a4756;border-radius:14px;background:var(--panel)}
.imp p{color:var(--muted);font-size:12.5px;margin-top:6px}
.imp .bar{height:6px;border-radius:6px;background:#26242f;margin-top:8px;overflow:hidden;display:none}
.imp .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.set .row.new{background:rgba(53,224,200,.06)}
.roundsel{display:flex;align-items:center;gap:4px}
.roundsel button{width:30px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:16px}
.roundsel span{min-width:84px;text-align:center;font-weight:700;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile .k{color:var(--muted);font-size:12px;font-weight:500}
.tile .v{font-size:22px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v.live{color:var(--teal)}
.main{display:grid;grid-template-columns:1fr 320px;gap:14px}
.court{position:relative;border-radius:22px;overflow:hidden;min-height:560px;border:1px solid #3a2f4a;
  background:
   radial-gradient(120% 60% at 15% 10%,rgba(255,61,129,.55),transparent 55%),
   radial-gradient(90% 55% at 90% 15%,rgba(255,122,26,.45),transparent 60%),
   radial-gradient(80% 60% at 20% 90%,rgba(53,224,200,.35),transparent 60%),
   radial-gradient(70% 50% at 80% 85%,rgba(120,80,255,.5),transparent 60%),
   linear-gradient(160deg,#2a0f3d,#120a24 45%,#06121d);}
.court svg.lines{position:absolute;inset:0;width:100%;height:100%;opacity:.22;pointer-events:none}
.court .wm{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-weight:800;letter-spacing:.25em;font-size:13px;color:rgba(255,255,255,.75)}
.court .wm b{color:var(--accent)}
.slots{position:absolute;inset:0}
.pcard{position:absolute;transform:translate(-50%,-50%);width:150px;background:var(--card);border:1.5px solid var(--cardline);border-radius:16px;padding:10px 8px 8px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .15s}
.pcard:active{transform:translate(-50%,-50%) scale(.97)}
.pcard .ph{width:54px;height:54px;border-radius:50%;margin:0 auto 6px;background:#1d1b26 center/cover no-repeat;position:relative;border:1px solid #2c2a36}
.pcard .crest{position:absolute;left:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;background:#fff center/80% no-repeat;border:1px solid #222}
.pcard .cap{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#000;font-size:11px;font-weight:800;display:grid;place-items:center}
.pcard .nm{font-weight:700;font-size:13px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .tm{color:var(--muted);font-size:11px;margin-top:2px}
.pcard .sep{height:1px;background:#2a2833;margin:7px 4px}
.pcard .gm{color:#c9c7d3;font-size:11px}
.pcard .fp{font-weight:800;font-size:14px;margin-top:3px;font-variant-numeric:tabular-nums}
.pcard .fp.pos{color:var(--text)} .pcard .fp.neg{color:var(--red)}
.oc{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:999px;margin-top:4px}
.oc.on{background:rgba(61,220,132,.16);color:var(--green)}
.oc.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.2s infinite}
.oc.off{background:#24222d;color:#aeacb8}
.pcard.court-on{border-color:var(--green);box-shadow:0 0 0 2px rgba(61,220,132,.35),0 10px 30px rgba(0,0,0,.45)}
.livedot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--red);margin-right:4px;animation:pulse 1.2s infinite;vertical-align:middle}
@keyframes pulse{50%{opacity:.25}}
.side{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden;align-self:start}
.side h3{font-size:16px;padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.side h3 span{color:var(--muted);font-size:12px;font-weight:500}
.brow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.brow:last-child{border-bottom:0}
.brow .ph{width:44px;height:44px;border-radius:50%;background:#1d1b26 center/cover no-repeat;flex:none;position:relative;border:1px solid #2c2a36}
.brow .ph .crest{position:absolute;left:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:#fff center/80% no-repeat}
.brow .info{flex:1;min-width:0}
.brow .nm{font-weight:700;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .tm{color:var(--muted);font-size:11.5px}
.brow .rt{text-align:right;flex:none}
.brow .rt .gm{color:#c9c7d3;font-size:11.5px}
.brow .rt .fp{font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.badge{display:inline-block;margin-top:3px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;background:#24222d;color:#cfcdd8}
.badge.six{background:rgba(53,224,200,.15);color:var(--teal)}
.games{margin-top:14px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:6px 0}
.games h3{font-size:15px;padding:10px 16px}
.grow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:9px 16px;border-top:1px solid var(--line);font-size:13px}
.grow .t{display:flex;align-items:center;gap:8px;font-weight:600}
.grow .t.r{justify-content:flex-end}
.grow img{width:20px;height:20px;object-fit:contain}
.grow .sc{text-align:center;font-weight:800;font-variant-numeric:tabular-nums;min-width:90px}
.grow .sc small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.grow.mine{background:rgba(255,122,26,.07)}
.status{color:var(--muted);font-size:12px;text-align:center;padding:10px}
.err{color:var(--red)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);display:none;z-index:50}
.ov.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(720px,100%);max-height:88vh;overflow:auto;background:#100f16;border:1px solid var(--line);border-radius:22px 22px 0 0;z-index:60;transition:transform .22s ease;padding:0 0 calc(env(safe-area-inset-bottom) + 18px)}
.sheet.on{transform:translate(-50%,0)}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#3a3846;margin:10px auto 4px}
.sheet .hd{display:flex;gap:14px;align-items:center;padding:10px 18px 14px}
.sheet .hd .ph{width:72px;height:72px;border-radius:50%;background:#1d1b26 center/cover no-repeat;flex:none;border:1px solid #2c2a36}
.sheet .hd h2{font-size:19px;font-weight:800}
.sheet .hd p{color:var(--muted);font-size:13px;margin-top:2px}
.sheet .close{margin-left:auto;align-self:flex-start;width:34px;height:34px;border-radius:50%;background:var(--panel2);font-size:18px}
.sec{padding:6px 18px 12px}
.sec h4{font-size:13px;color:var(--muted);font-weight:600;margin:6px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.kv b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.kv span{color:var(--muted);font-size:11px}
.fpbox{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,rgba(255,122,26,.18),rgba(255,61,129,.12));border:1px solid rgba(255,122,26,.35);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.fpbox b{font-size:24px}
.fpbox small{color:#e7d9cf;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:11.5px}
th:first-child,td:first-child{text-align:left}
tr.avg td{font-weight:700;color:var(--teal)}
.tblwrap{overflow-x:auto}
/* game sheet */
.grow{cursor:pointer;width:100%;text-align:inherit;color:inherit}
.grow:hover{background:rgba(255,255,255,.03)}
.grow .t,.grow .t.r{min-width:0}
.ghd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:8px 16px 6px;text-align:center}
.ghd img{width:46px;height:46px;object-fit:contain}
.ghd .tn{font-weight:700;font-size:13px;margin-top:4px}
.ghd .s{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums}
.ghd .s small{display:block;font-size:12px;font-weight:600;color:var(--muted)}
.ghd .close{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--panel2);font-size:16px}
.qtr{display:flex;justify-content:center;gap:10px;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;padding:0 16px 10px}
.tabs{display:flex;gap:6px;padding:0 16px 8px}
.tabs button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:13px;color:var(--text)}
.tabs button img{width:18px;height:18px;object-fit:contain}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#111}
table.bx td.n{text-align:left;white-space:nowrap;max-width:130px;overflow:hidden;text-overflow:ellipsis}
table.bx td.n small{color:var(--muted);margin-right:4px}
table.bx tr[data-code]{cursor:pointer}
table.bx tr.mine td{background:rgba(255,122,26,.12)}
table.bx tr.mine td.n b{color:var(--accent)}
table.bx tr.dnp td{color:var(--muted)}
table.bx tr.tot td{font-weight:700;color:var(--teal)}
table.bx .pd{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:middle}
.hint{color:var(--muted);font-size:11px;padding:6px 2px 0}
.rwarn{display:none;width:100%;text-align:left;background:rgba(255,90,106,.12);border:1px solid rgba(255,90,106,.5);color:#ffb3bb;border-radius:12px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:10px}
/* settings */
.set .row{display:grid;grid-template-columns:1fr 110px 40px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.set .row .nm{font-weight:600;font-size:13.5px}
.set .row .nm small{display:block;color:var(--muted);font-weight:500;font-size:11.5px}
.set select,.set input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px;font:inherit;font-size:13px}
.set .capbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:800}
.set .capbtn.on{background:var(--teal);color:#000;border-color:var(--teal)}
.set .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--accent);color:#111;font-weight:700;padding:10px 14px;border-radius:12px}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.set .msg{font-size:12.5px;margin-top:8px;color:var(--muted)}
.search{position:relative}
.sres{position:absolute;left:0;right:0;top:100%;background:#16151d;border:1px solid var(--line);border-radius:10px;max-height:220px;overflow:auto;z-index:5;display:none}
.sres button{display:block;width:100%;text-align:left;padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line)}
.sres button small{color:var(--muted)}
.repl{display:none;grid-column:1/-1}
@media (max-width:860px){
  .main{grid-template-columns:1fr}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .court{min-height:660px}
  .pcard{width:118px;padding:8px 6px 7px;border-radius:14px}
  .pcard .ph{width:46px;height:46px}
  .pcard .nm{font-size:12px}
  .pcard .tm,.pcard .gm{font-size:10.5px}
  .kv{grid-template-columns:repeat(4,1fr)}
  header .brand small{display:none}
}
@media (max-width:380px){ .roundsel span{min-width:56px} }
@media (max-width:600px){
  .wrap{padding:8px 10px}
  header{padding:2px 0 8px;gap:6px}
  .brand h1,.brand small{display:none}
  .brand .logo{width:30px;height:30px;border-radius:9px;font-size:14px}
  .hbtns{gap:5px}
  .roundsel{gap:3px}
  .roundsel button{width:28px;height:30px;border-radius:9px;font-size:14px}
  .roundsel span{min-width:62px;font-size:13px}
  .pill{padding:6px 9px;border-radius:10px;font-size:12px}
  .pill.icon{padding:6px 9px;font-size:14px}
  #setBtn .lbl{display:none}
  .tiles{grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
  .tile{padding:7px 8px;border-radius:12px}
  .tile .k{font-size:9.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .v{font-size:16px;margin-top:2px}
  #tUpd{font-size:12px!important}
  .main{gap:8px}
  .court{min-height:430px;border-radius:16px}
  .court .wm{font-size:10px;bottom:8px}
  .pcard{width:31%;max-width:118px;padding:6px 4px 5px;border-radius:12px;border-width:1px}
  .pcard .ph{width:34px;height:34px;margin-bottom:3px}
  .pcard .crest{width:15px;height:15px;left:-3px;bottom:-3px}
  .pcard .cap{width:16px;height:16px;font-size:9px;right:-5px;top:-5px}
  .pcard .nm{font-size:11px}
  .pcard .tm{font-size:9px;margin-top:1px}
  .pcard .sep{margin:4px 2px}
  .pcard .gm{font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pcard .fp{font-size:12px;margin-top:1px}
  .oc{font-size:8.5px;padding:1px 6px;margin-top:3px}
  .side{border-radius:16px}
  .side h3{font-size:13px;padding:9px 12px}
  .brow{padding:7px 10px;gap:8px}
  .brow .ph{width:32px;height:32px}
  .brow .ph .crest{width:13px;height:13px}
  .brow .nm{font-size:12px}
  .brow .tm,.brow .rt .gm{font-size:10px}
  .brow .rt .fp{font-size:12px}
  .badge{font-size:9px;padding:1px 6px;margin-top:2px}
  .games{border-radius:16px;margin-top:8px}
  .games h3{font-size:13px;padding:8px 12px}
  .grow{padding:7px 12px;font-size:11.5px}
  .grow img{width:16px;height:16px}
  .grow .sc{min-width:70px}
  .status{font-size:11px}
  .sheet .hd .ph{width:56px;height:56px}
  .sheet .hd h2{font-size:16px}
  .kv{gap:6px}.kv div{padding:6px 7px}.kv b{font-size:14px}
  table{font-size:11.5px} th,td{padding:6px 4px}
  .ghd img{width:38px;height:38px}.ghd .s{font-size:24px}.ghd .tn{font-size:12px}
  table.bx{font-size:11px} table.bx th,table.bx td{padding:6px 3px} table.bx td.n{max-width:104px}
}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="logo">★</div><div><h1>Fantasy Live</h1><small>EuroLeague · tavo komanda realiu laiku</small></div></div>
    <div class="hbtns">
      <div class="roundsel"><button id="prevR" aria-label="Ankstesnis turas">‹</button><span id="rLbl">Turas …</span><button id="nextR" aria-label="Kitas turas">›</button></div>
      <button class="pill icon" id="refBtn" aria-label="Atnaujinti" title="Atnaujinti"><span>↻</span></button>
      <button class="pill" id="setBtn">⚙︎<span class="lbl"> Komanda</span></button>
    </div>
  </header>

  <div class="tiles">
    <div class="tile"><div class="k">Turo taškai</div><div class="v" id="tPts">–</div></div>
    <div class="tile"><div class="k">Aikštėje dabar</div><div class="v live" id="tLive">0</div></div>
    <div class="tile"><div class="k">Sužaidė</div><div class="v" id="tDone">0/10</div></div>
    <div class="tile"><div class="k">Atnaujinta</div><div class="v" id="tUpd" style="font-size:16px">–</div></div>
  </div>

  <div class="main">
    <div class="court" id="court">
      <svg class="lines" viewBox="0 0 400 560" preserveAspectRatio="none" aria-hidden="true">
        <g fill="none" stroke="#fff" stroke-width="2">
          <path d="M60 60 L340 60 L380 520 L20 520 Z"/>
          <path d="M150 60 L150 200 L250 200 L250 60"/>
          <path d="M150 200 A50 30 0 0 0 250 200"/>
          <path d="M90 60 Q90 300 200 300 Q310 300 310 60"/>
          <ellipse cx="200" cy="440" rx="60" ry="30"/>
        </g>
      </svg>
      <div class="slots" id="slots"></div>
      <div class="wm"><b>★</b> FANTASY LIVE</div>
    </div>
    <div class="side">
      <h3>Suolas <span>6-as 100% · kiti 50%</span></h3>
      <div id="bench"></div>
    </div>
  </div>

  <div class="games">
    <h3>Turo rungtynės</h3>
    <div id="games"><div class="status">Kraunama…</div></div>
  </div>
  <div class="status" id="foot">Duomenys: EuroLeague (live.euroleague.net). FPTS = PIR × 1,1 pergalės / × 0,9 pralaimėjimo atveju.</div>
</div>

<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>

<script>
(() => {
const SEASON = 'E2026';
const API = 'https://api-live.euroleague.net/v2/competitions/E/seasons/' + SEASON;
const LIVE = 'https://live.euroleague.net/api';
// Numatytoji sudėtis (EuroLeague asmens kodai). r: s=startas, x=6-as, b=suolas; c=kapitonas
const DEFAULT = [
  {c:'015164', r:'s'}, // Besson
  {c:'013369', r:'s', cap:1}, // C. Jones
  {c:'011286', r:'s'}, // Bacon
  {c:'008192', r:'s'}, // Tubelis
  {c:'014108', r:'s'}, // Diarra
  {c:'007027', r:'x'}, // Maledon
  {c:'015166', r:'b'}, // Crowder
  {c:'008084', r:'b'}, // Mantzoukas
  {c:'005637', r:'b'}, // Tanaskovic
  {c:'006661', r:'b'}  // Wilbekin
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const fmt = n => (n == null || isNaN(n)) ? '–' : (Math.round(n * 100) / 100).toLocaleString('lt-LT', {maximumFractionDigits: 2});

// ---------- roster storage (URL hash > localStorage > default) ----------
function encodeRoster(r){ return r.map(p => p.c + p.r + (p.cap ? 'c' : '')).join('.'); }
function decodeRoster(s){
  try{
    const out = s.split('.').map(t => { const m = t.match(/^(\d{6})([sxb])(c?)$/); if(!m) throw 0; return {c:m[1], r:m[2], cap: m[3] ? 1 : 0}; });
    return out.length === 10 ? out : null;
  }catch(e){ return null; }
}
function loadRoster(){
  const h = new URLSearchParams(location.hash.slice(1)).get('r');
  if(h){ const r = decodeRoster(h); if(r){ saveRoster(r, false); return r; } }
  try{ const s = localStorage.getItem('flive_roster'); if(s){ const r = decodeRoster(s); if(r) return r; } }catch(e){}
  return DEFAULT.map(p => ({...p, cap: p.cap ? 1 : 0}));
}
function rosterIssue(r){
  const s = r.filter(p => p.r === 's').length, x = r.filter(p => p.r === 'x').length, c = r.filter(p => p.cap).length;
  if(new Set(r.map(p => p.c)).size !== 10) return 'Žaidėjai kartojasi.';
  if(s !== 5) return 'Starte turi būti 5 žaidėjai (dabar ' + s + ').';
  if(x !== 1) return 'Turi būti lygiai vienas 6-as žaidėjas (dabar ' + x + ').';
  if(c !== 1) return 'Pasirink kapitoną (C).';
  return '';
}
function saveRoster(r, setHash = true){
  const enc = encodeRoster(r);
  try{ localStorage.setItem('flive_roster', enc); }catch(e){}
  if(setHash) history.replaceState(null, '', '#r=' + enc);
}

let roster = loadRoster();
let people = {};      // code -> {name, club, pos, img, dorsal}
let clubs = {};       // code -> {name, crest, short}
let roundGames = {};  // round -> games[]
let boxCache = {};    // gamecode -> {box, header, t}
let curRound = null, viewRound = null, lastUpdate = null, timer = null;

async function j(url, tries = 3){
  for(let i = 0; ; i++){
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) throw new Error(r.status + ' ' + url);
      const t = await r.text();
      return t ? JSON.parse(t) : null;
    }catch(e){
      if(i >= tries - 1) throw e;
      await new Promise(res => setTimeout(res, 800 * (i + 1)));
    }
  }
}

function niceName(n){ // "JONES, CARLIK" -> "C. Jones"
  if(!n) return '';
  const [last, first] = n.split(',').map(s => s.trim());
  const cap = s => s.toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()).replace(/\b(Ii|Iii|Iv)\b/g, m => m.toUpperCase());
  return first ? cap(first)[0] + '. ' + cap(last) : cap(last);
}
function fullName(n){
  if(!n) return '';
  const [last, first] = n.split(',').map(s => s.trim());
  const cap = s => s.toLowerCase().replace(/(^|[\s\-'])(\p{L})/gu, (m, a, b) => a + b.toUpperCase()).replace(/\b(Ii|Iii|Iv)\b/g, m => m.toUpperCase());
  return (first ? cap(first) + ' ' : '') + cap(last);
}

async function loadPeople(){
  const d = await j(API + '/people?personType=J');
  for(const r of (d.data || d)){
    people[r.person.code] = {
      name: r.person.name, club: r.club?.code, pos: r.positionName || '', dorsal: r.dorsal,
      img: r.images?.headshot || r.images?.action || '', country: r.person.country?.name || '', height: r.person.height
    };
    if(r.club) clubs[r.club.code] = clubs[r.club.code] || {name: r.club.editorialName || r.club.name, crest: r.club.images?.crest || ''};
  }
}

async function loadRound(n){
  if(roundGames[n]) return roundGames[n];
  const d = await j(API + '/games?roundNumber=' + n);
  const games = (d?.data || []).map(g => ({
    code: g.gameCode, utc: g.utcDate, played: g.played,
    home: g.local.club.code, away: g.road.club.code,
    hs: g.local.score, as: g.road.score,
    homeName: g.local.club.abbreviatedName || g.local.club.name, awayName: g.road.club.abbreviatedName || g.road.club.name,
    homeCrest: g.local.club.images?.crest, awayCrest: g.road.club.images?.crest
  }));
  for(const g of games){
    clubs[g.home] = {...(clubs[g.home] || {}), short: g.homeName, crest: g.homeCrest || clubs[g.home]?.crest};
    clubs[g.away] = {...(clubs[g.away] || {}), short: g.awayName, crest: g.awayCrest || clubs[g.away]?.crest};
  }
  roundGames[n] = games;
  return games;
}

async function findCurrentRound(){
  let guess = 1;
  try{ guess = +localStorage.getItem('flive_round') || 1; }catch(e){}
  let r = Math.max(1, guess);
  // eiti atgal, kol ankstesnis turas dar nebaigtas
  while(r > 1){ const p = await loadRound(r - 1); if(p.length && p.some(x => !x.played)) r--; else break; }
  // eiti pirmyn iki pirmo turo su nesužaistomis rungtynėmis
  for(let i = 0; i < 40; i++){
    const g = await loadRound(r);
    if(!g.length){ r = Math.max(1, r - 1); break; }
    if(g.some(x => !x.played)) break;
    r++;
  }
  try{ localStorage.setItem('flive_round', r); }catch(e){}
  return r;
}

async function loadBox(code, force){
  const c = boxCache[code];
  if(c && !force && (c.final || Date.now() - c.t < 20000)) return c;
  const [box, header] = await Promise.all([
    j(LIVE + '/Boxscore?gamecode=' + code + '&seasoncode=' + SEASON).catch(() => null),
    j(LIVE + '/Header?gamecode=' + code + '&seasoncode=' + SEASON).catch(() => null)
  ]);
  const players = {};
  if(box && box.Stats){
    for(const t of box.Stats) for(const p of t.PlayersStats || []){
      const id = String(p.Player_ID || '').trim().replace(/^P/, '');
      if(id) players[id] = p;
    }
  }
  const live = !!(header?.Live || box?.Live);
  const sA = +(header?.ScoreA || 0), sB = +(header?.ScoreB || 0);
  const hasStats = Object.keys(players).length > 0;
  const final = hasStats && !live;
  const res = {box, header, players, live, final, sA, sB, codeA: header?.CodeTeamA, codeB: header?.CodeTeamB,
               quarter: header?.Quarter, clock: header?.RemainingPartialTime, t: Date.now()};
  boxCache[code] = res;
  return res;
}

function gameFor(club, round){
  return (roundGames[round] || []).find(g => g.home === club || g.away === club);
}

function playerLine(code, club, round){
  const g = gameFor(club, round);
  if(!g) return {state: 'nogame'};
  const b = boxCache[g.code];
  const home = g.home === club;
  const opp = home ? g.away : g.home;
  const base = {g, opp, home};
  if(!b || (!b.live && !b.final && !Object.keys(b.players).length)) return {...base, state: 'pre'};
  const p = b.players[code];
  const my = b.codeA === club ? b.sA : b.sB;
  const their = b.codeA === club ? b.sB : b.sA;
  const winning = my > their, tie = my === their;
  const mult = b.final ? (winning ? 1.1 : 0.9) : (tie ? 1 : (winning ? 1.1 : 0.9));
  if(!p) return {...base, state: b.final ? 'dnp' : 'live', eff: 0, fp: 0, mult, live: b.live, final: b.final, my, their, onCourt: b.live ? false : null};
  const eff = +p.Valuation || 0;
  const onCourt = b.live ? (+p.IsPlaying === 1) : null;
  return {...base, state: b.final ? 'final' : (b.live ? 'live' : 'final'), p, eff, fp: Math.round(eff * mult * 100) / 100, mult, live: b.live, final: b.final, my, their, onCourt};
}

const roleW = r => r === 'b' ? 0.5 : 1;

function crestStyle(club){ const c = clubs[club]?.crest; return c ? `background-image:url('${esc(c)}')` : ''; }
function photoStyle(code){ const i = people[code]?.img; return i ? `background-image:url('${esc(i)}')` : ''; }
function teamShort(club){ return clubs[club]?.short || club; }

function gameText(L){
  if(L.state === 'nogame') return 'Nežaidžia šį turą';
  const pre = (L.home ? 'vs ' : '@ ') + L.opp;
  if(L.state === 'pre'){
    const d = new Date(L.g.utc);
    return `${pre} · ${d.toLocaleDateString('lt-LT', {weekday: 'short'})} ${d.toLocaleTimeString('lt-LT', {hour: '2-digit', minute: '2-digit'})}`;
  }
  if(L.live) return `<span class="livedot"></span>${pre} · ${L.my}:${L.their}`;
  return `${pre} · ${L.my}:${L.their} ${L.my > L.their ? 'W' : 'L'}`;
}
function ocBadge(L){
  if(L.onCourt == null) return '';
  return L.onCourt ? '<span class="oc on">AIKŠTĖJE</span>' : '<span class="oc off">ANT SUOLO</span>';
}
function fpText(L, cap){
  if(L.state === 'pre' || L.state === 'nogame') return '–';
  const v = L.fp * (cap ? 2 : 1);
  return fmt(v) + ' FPTS' + (cap ? ' (×2)' : '');
}

const SLOT_POS = { // [x%, y%] by formation index
  5: [[50,20],[22,46],[78,46],[34,76],[66,76]]
};

function render(){
  const R = viewRound;
  $('#rLbl').textContent = 'Turas ' + R;
  const lines = roster.map(p => ({...p, P: people[p.c] || {name: p.c, club: '', pos: ''}, L: null}));
  for(const x of lines) x.L = playerLine(x.c, x.P.club, R);
  // totals
  let total = 0, liveN = 0, doneN = 0;
  for(const x of lines){
    const L = x.L;
    if(L.onCourt) liveN++;
    if(L.state === 'final' || L.state === 'dnp') doneN++;
    if(L.fp != null) total += L.fp * roleW(x.r) * (x.cap ? 2 : 1);
  }
  $('#tPts').textContent = fmt(total);
  $('#tLive').textContent = liveN;
  $('#tDone').textContent = doneN + '/10';
  $('#tUpd').textContent = lastUpdate ? lastUpdate.toLocaleTimeString('lt-LT', {hour: '2-digit', minute: '2-digit', second: '2-digit'}) : '–';

  // starters on court: order C first, then F, then G
  const order = {Center: 0, Forward: 1, Guard: 2};
  const st = lines.filter(x => x.r === 's').sort((a, b) => (order[a.P.pos] ?? 3) - (order[b.P.pos] ?? 3));
  const pos = st.length === 5 ? layout(st) : gridLayout(st.length);
  const bad = rosterIssue(roster);
  let wb = $('#rwarn');
  if(!wb){ wb = document.createElement('button'); wb.id = 'rwarn'; wb.className = 'rwarn'; $('.main').before(wb); wb.onclick = () => openSettings(); }
  wb.style.display = bad ? 'block' : 'none';
  wb.textContent = bad ? '⚠︎ Sudėtis neteisinga: ' + bad + ' Spausk čia ir pataisyk.' : '';
  $('#slots').innerHTML = st.map((x, i) => card(x, pos[i])).join('');
  // bench: 6th first
  const bench = lines.filter(x => x.r !== 's').sort((a, b) => (a.r === 'x' ? -1 : 0) - (b.r === 'x' ? -1 : 0));
  $('#bench').innerHTML = bench.map(benchRow).join('');
  document.querySelectorAll('[data-code]').forEach(el => el.onclick = () => openPlayer(el.dataset.code));
  renderGames();
}
function gridLayout(n){
  const rows = Math.max(1, Math.ceil(n / 3)), out = [];
  for(let i = 0; i < n; i++){
    const ri = Math.floor(i / 3), inRow = Math.min(3, n - ri * 3), k = i % 3;
    const xs = inRow === 1 ? [50] : inRow === 2 ? [27, 73] : [17, 50, 83];
    out.push([xs[k], rows === 1 ? 50 : 14 + ri * (66 / (rows - 1))]);
  }
  return out;
}
function layout(st){
  // C on top row(s), F middle, G bottom like the official court
  const c = st.filter(x => x.P.pos === 'Center'), f = st.filter(x => x.P.pos === 'Forward'), g = st.filter(x => x.P.pos !== 'Center' && x.P.pos !== 'Forward');
  const rows = [c, f, g].filter(r => r.length);
  const ys = rows.length === 3 ? [16, 46, 77] : rows.length === 2 ? [27, 67] : [50];
  const map = new Map();
  rows.forEach((r, ri) => r.forEach((x, k) => {
    const n = r.length, xs = n === 1 ? [50] : n === 2 ? [27, 73] : [17, 50, 83];
    map.set(x, [xs[k], ys[ri] + (n === 3 && k === 1 ? 6 : 0)]);
  }));
  return st.map(x => map.get(x));
}
function card(x, [px, py]){
  const L = x.L, fp = L.fp ?? null;
  return `<button class="pcard ${L.onCourt ? 'court-on' : ''}" data-code="${x.c}" style="left:${px}%;top:${py}%">
    <div class="ph" style="${photoStyle(x.c)}"><div class="crest" style="${crestStyle(x.P.club)}"></div>${x.cap ? '<div class="cap">C</div>' : ''}</div>
    <div class="nm">${esc(niceName(x.P.name))}</div>
    <div class="tm">${esc(x.P.club)} · ${esc(x.P.pos)}</div>
    <div class="sep"></div>
    <div class="gm">${gameText(L)}</div>
    <div class="fp ${fp != null && fp < 0 ? 'neg' : 'pos'}">${fpText(L, x.cap)}</div>${ocBadge(L)}
  </button>`;
}
function benchRow(x){
  const L = x.L;
  return `<button class="brow" data-code="${x.c}">
    <div class="ph" style="${photoStyle(x.c)}"><div class="crest" style="${crestStyle(x.P.club)}"></div></div>
    <div class="info"><div class="nm">${esc(niceName(x.P.name))}</div><div class="tm">${esc(x.P.club)} · ${esc(x.P.pos)}</div></div>
    <div class="rt"><div class="gm">${gameText(L)}</div><div class="fp">${L.fp != null ? fmt(L.fp * roleW(x.r)) + ' FPTS' : '–'}</div><span class="badge ${x.r === 'x' ? 'six' : ''}">${x.r === 'x' ? '100% PTS' : '50% PTS'}</span>${L.onCourt != null ? '<br>' + ocBadge(L) : ''}</div>
  </button>`;
}
function renderGames(){
  const gs = (roundGames[viewRound] || []).slice().sort((a, b) => Date.parse(a.utc) - Date.parse(b.utc));
  const myClubs = new Set(roster.map(p => people[p.c]?.club));
  if(!gs.length){ $('#games').innerHTML = '<div class="status">Šio turo rungtynių nėra.</div>'; return; }
  $('#games').innerHTML = gs.map(g => {
    const b = boxCache[g.code];
    let mid;
    if(b && (b.live || b.final)){
      const hs = b.codeA === g.home ? b.sA : b.sB, as = b.codeA === g.home ? b.sB : b.sA;
      mid = `${hs} : ${as}<small>${b.live ? '<span class="livedot"></span>' + esc(b.quarter ? 'K' + b.quarter : '') + ' ' + esc(b.clock || '') : 'Baigtos'}</small>`;
    } else if(g.played){
      mid = `${g.hs} : ${g.as}<small>Baigtos</small>`;
    } else {
      const d = new Date(g.utc);
      mid = `${d.toLocaleTimeString('lt-LT', {hour: '2-digit', minute: '2-digit'})}<small>${d.toLocaleDateString('lt-LT', {weekday: 'short', month: '2-digit', day: '2-digit'})}</small>`;
    }
    const mine = myClubs.has(g.home) || myClubs.has(g.away);
    return `<button class="grow ${mine ? 'mine' : ''}" data-game="${g.code}">
      <div class="t">${g.homeCrest ? `<img src="${esc(g.homeCrest)}" alt="">` : ''}${esc(g.homeName)}</div>
      <div class="sc">${mid}</div>
      <div class="t r">${esc(g.awayName)}${g.awayCrest ? `<img src="${esc(g.awayCrest)}" alt="">` : ''}</div>
    </button>`;
  }).join('');
  document.querySelectorAll('[data-game]').forEach(el => el.onclick = () => openGame(+el.dataset.game));
}

function openSheet(html){ $('#sheet').innerHTML = '<div class="grab"></div>' + html; $('#ov').classList.add('on'); $('#sheet').classList.add('on'); }
function closeSheet(){ openGameCode = null; $('#ov').classList.remove('on'); $('#sheet').classList.remove('on'); }
$('#ov').onclick = closeSheet;

function statGrid(p){
  const fg2 = `${p.FieldGoalsMade2}/${p.FieldGoalsAttempted2}`, fg3 = `${p.FieldGoalsMade3}/${p.FieldGoalsAttempted3}`, ft = `${p.FreeThrowsMade}/${p.FreeThrowsAttempted}`;
  const items = [['MIN', p.Minutes || '0:00'], ['PTS', p.Points], ['REB', p.TotalRebounds], ['AST', p.Assistances],
    ['STL', p.Steals], ['BLK', p.BlocksFavour], ['TOV', p.Turnovers], ['PIR', p.Valuation],
    ['2P', fg2], ['3P', fg3], ['FT', ft], ['+/-', p.Plusminus ?? '–'],
    ['OREB', p.OffensiveRebounds], ['DREB', p.DefensiveRebounds], ['PF', p.FoulsCommited], ['RF', p.FoulsReceived]];
  return '<div class="kv">' + items.map(([k, v]) => `<div><b>${esc(v)}</b><span>${k}</span></div>`).join('') + '</div>';
}

async function openPlayer(code){
  openGameCode = null;
  const x = roster.find(p => p.c === code);
  const P = people[code] || {name: code};
  const L = playerLine(code, P.club, viewRound);
  const roleTxt = x ? (x.r === 's' ? 'Startas' : x.r === 'x' ? '6-as žaidėjas (100%)' : 'Suolas (50%)') + (x.cap ? ' · Kapitonas ×2' : '') : '';
  let cur = '';
  if(L.state === 'pre') cur = `<div class="status">${gameText(L)}</div>`;
  else if(L.state === 'nogame') cur = '<div class="status">Šį turą nežaidžia</div>';
  else if(L.p){
    const w = x ? roleW(x.r) * (x.cap ? 2 : 1) : 1;
    cur = (L.onCourt != null ? `<div style="margin:-2px 0 8px">${ocBadge(L)}</div>` : '') + `<div class="fpbox"><div><small>${L.live ? 'Live · preliminariai' : 'Galutinis'} · PIR ${L.eff} × ${L.mult}${w !== 1 ? ' × ' + w : ''}</small><br><b>${fmt(L.fp * w)} FPTS</b></div><div style="text-align:right"><small>${gameText(L)}</small></div></div>` + statGrid(L.p);
  } else cur = '<div class="status">Nežaidė (DNP)</div>';
  openSheet(`<div class="hd"><div class="ph" style="${photoStyle(code)}"></div><div><h2>${esc(fullName(P.name))}</h2><p>${esc(teamShort(P.club))} · ${esc(P.pos)}${P.dorsal ? ' · #' + esc(P.dorsal) : ''}</p><p>${esc(roleTxt)}</p></div><button class="close" aria-label="Uždaryti">✕</button></div>
    <div class="sec"><h4>Turas ${viewRound}</h4>${cur}</div>
    <div class="sec"><h4>Sezonas</h4><div id="seasonLog" class="status">Kraunama…</div></div>`);
  $('#sheet .close').onclick = closeSheet;
  try{ $('#seasonLog').outerHTML = await seasonLog(code, P.club); }
  catch(e){ const el = $('#seasonLog'); if(el){ el.textContent = 'Nepavyko įkelti sezono statistikos.'; el.classList.add('err'); } }
}

async function seasonLog(code, club){
  const rounds = []; for(let r = 1; r <= curRound; r++) rounds.push(r);
  await Promise.all(rounds.map(loadRound));
  const gs = rounds.map(r => ({r, g: gameFor(club, r)})).filter(x => x.g && (x.g.played || boxCache[x.g.code]?.live));
  await Promise.all(gs.map(x => loadBox(x.g.code)));
  const rows = [];
  for(const {r, g} of gs){
    const L = playerLine(code, club, r);
    if(!L.p) { rows.push({r, opp: (L.home ? 'vs ' : '@ ') + L.opp, dnp: true}); continue; }
    rows.push({r, opp: (L.home ? 'vs ' : '@ ') + L.opp, res: `${L.my}:${L.their}`, min: L.p.Minutes, pts: L.p.Points, reb: L.p.TotalRebounds, ast: L.p.Assistances, pir: L.eff, fp: L.fp});
  }
  if(!rows.length) return '<div class="status">Dar nėra sužaistų rungtynių.</div>';
  const pl = rows.filter(x => !x.dnp), n = pl.length || 1;
  const avg = k => pl.reduce((s, x) => s + (+x[k] || 0), 0) / n;
  const toMin = m => { if(!m) return 0; const [a, b] = String(m).split(':').map(Number); return a + (b || 0) / 60; };
  const avgMin = pl.reduce((s, x) => s + toMin(x.min), 0) / n;
  return `<div class="tblwrap"><table><thead><tr><th>Tur.</th><th>Varž.</th><th>Rez.</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>PIR</th><th>FPTS</th></tr></thead><tbody>
    ${rows.map(x => x.dnp ? `<tr><td>${x.r}</td><td style="text-align:left">${esc(x.opp)}</td><td colspan="7" style="text-align:center;color:var(--muted)">Nežaidė</td></tr>` :
      `<tr><td>${x.r}</td><td style="text-align:left">${esc(x.opp)}</td><td>${esc(x.res)}</td><td>${esc(x.min)}</td><td>${x.pts}</td><td>${x.reb}</td><td>${x.ast}</td><td>${x.pir}</td><td><b>${fmt(x.fp)}</b></td></tr>`).join('')}
    <tr class="avg"><td colspan="3">Vidurkis</td><td>${avgMin.toFixed(1)}</td><td>${avg('pts').toFixed(1)}</td><td>${avg('reb').toFixed(1)}</td><td>${avg('ast').toFixed(1)}</td><td>${avg('pir').toFixed(1)}</td><td>${avg('fp').toFixed(1)}</td></tr>
  </tbody></table></div>`;
}


// ---------- game sheet ----------
let openGameCode = null, gameTab = null;
const toMinN = m => { if(!m) return 0; const [a, b] = String(m).split(':').map(Number); return (a || 0) + (b || 0) / 60; };
async function openGame(code, keepTab){
  const g = (roundGames[viewRound] || []).find(x => x.code === code);
  if(!g) return;
  if(!keepTab){
    const myClubs = new Set(roster.map(p => people[p.c]?.club));
    gameTab = myClubs.has(g.home) || !myClubs.has(g.away) ? g.home : g.away;
  }
  openGameCode = code;
  const started = g.played || Date.parse(g.utc) - Date.now() < 15 * 60e3;
  const b = started ? await loadBox(code).catch(() => null) : null;
  if(openGameCode !== code) return;
  const hasStats = b && Object.keys(b.players).length > 0;
  const hs = b && (b.live || b.final) ? (b.codeA === g.home ? b.sA : b.sB) : g.hs;
  const as = b && (b.live || b.final) ? (b.codeA === g.home ? b.sB : b.sA) : g.as;
  const d = new Date(g.utc);
  let mid;
  if(b && b.live) mid = `${hs} : ${as}<small><span class="livedot"></span>${esc(b.quarter ? 'K' + b.quarter : '')} ${esc(b.clock || '')}</small>`;
  else if(hasStats || g.played) mid = `${hs} : ${as}<small>Baigtos</small>`;
  else mid = `${d.toLocaleTimeString('lt-LT', {hour: '2-digit', minute: '2-digit'})}<small>${d.toLocaleDateString('lt-LT', {weekday: 'short', month: '2-digit', day: '2-digit'})}</small>`;
  // ketvirčiai
  let qtr = '';
  const BQ = b?.box?.ByQuarter;
  if(Array.isArray(BQ) && BQ.length === 2 && hasStats){
    const keys = Object.keys(BQ[0]).filter(k => /^Quarter\d|^Extra/i.test(k) && BQ[0][k] != null && BQ[0][k] !== '');
    const idxH = b.codeA === g.home ? 0 : 1;
    while(keys.length > 1 && !(+BQ[0][keys[keys.length - 1]]) && !(+BQ[1][keys[keys.length - 1]])) keys.pop();
    qtr = '<div class="qtr">' + keys.map(k => `<span>${BQ[idxH][k]}–${BQ[1 - idxH][k]}</span>`).join('') + '</div>';
  }
  let bodyHtml;
  try{ bodyHtml = hasStats ? boxTable(g, b, gameTab) : await preGameTable(gameTab); }
  catch(e){ bodyHtml = '<div class="status err">Nepavyko įkelti statistikos.</div>'; }
  if(openGameCode !== code) return;
  const tabBtn = (club, name, crest) => `<button data-tab="${club}" class="${gameTab === club ? 'on' : ''}">${crest ? `<img src="${esc(crest)}" alt="">` : ''}${esc(name)}</button>`;
  const html = `<div style="position:relative"><div class="ghd">
      <div>${g.homeCrest ? `<img src="${esc(g.homeCrest)}" alt="">` : ''}<div class="tn">${esc(g.homeName)}</div></div>
      <div class="s">${mid}</div>
      <div>${g.awayCrest ? `<img src="${esc(g.awayCrest)}" alt="">` : ''}<div class="tn">${esc(g.awayName)}</div></div>
    </div><button class="close" aria-label="Uždaryti" style="position:absolute;right:14px;top:4px;width:32px;height:32px;border-radius:50%;background:var(--panel2)">✕</button></div>
    ${qtr}
    <div class="tabs">${tabBtn(g.home, g.homeName, g.homeCrest)}${tabBtn(g.away, g.awayName, g.awayCrest)}</div>
    <div class="sec" style="padding-top:0" id="gbody">${bodyHtml}</div>`;
  const wasOpen = $('#sheet').classList.contains('on') && $('#sheet .tabs');
  const scroll = $('#sheet').scrollTop;
  openSheet(html);
  if(wasOpen) $('#sheet').scrollTop = scroll;
  $('#sheet .close').onclick = closeSheet;
  document.querySelectorAll('#sheet [data-tab]').forEach(el => el.onclick = () => { gameTab = el.dataset.tab; openGame(code, true); });
  $('#gbody').querySelectorAll('[data-code]').forEach(el => el.onclick = () => openPlayer(el.dataset.code));
}

function boxTable(g, b, club){
  const mine = new Set(roster.map(p => p.c));
  const my = b.codeA === club ? b.sA : b.sB, their = b.codeA === club ? b.sB : b.sA;
  const mult = b.final ? (my > their ? 1.1 : 0.9) : (my === their ? 1 : (my > their ? 1.1 : 0.9));
  const rows = Object.entries(b.players).filter(([, p]) => String(p.Team || '').trim() === club)
    .map(([code, p]) => ({code, p, played: toMinN(p.Minutes) > 0 || p.Valuation, pir: +p.Valuation || 0}))
    .sort((a, c) => (c.played ? 1 : 0) - (a.played ? 1 : 0) || c.pir - a.pir);
  if(!rows.length) return '<div class="status">Statistikos dar nėra.</div>';
  const sum = k => rows.reduce((s, x) => s + (+x.p[k] || 0), 0);
  const tr = x => {
    const p = x.p, nm = niceName(p.Player);
    if(!x.played) return `<tr class="dnp ${mine.has(x.code) ? 'mine' : ''}" data-code="${x.code}"><td class="n"><small>${esc(p.Dorsal)}</small>${esc(nm)}</td><td colspan="6" style="text-align:center">Nežaidė</td></tr>`;
    const dot = b.live && +p.IsPlaying === 1 ? '<span class="pd"></span>' : '';
    return `<tr class="${mine.has(x.code) ? 'mine' : ''}" data-code="${x.code}"><td class="n">${dot}<small>${esc(p.Dorsal)}</small><b>${esc(nm)}</b>${+p.IsStarter === 1 ? ' <small>*</small>' : ''}</td><td>${parseInt(String(p.Minutes || '0')) || 0}</td><td>${p.Points}</td><td>${p.TotalRebounds}</td><td>${p.Assistances}</td><td>${x.pir}</td><td><b>${fmt(Math.round(x.pir * mult * 100) / 100)}</b></td></tr>`;
  };
  return `<div class="tblwrap"><table class="bx"><thead><tr><th>Žaidėjas</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>PIR</th><th>FPTS</th></tr></thead><tbody>
    ${rows.map(tr).join('')}
    <tr class="tot"><td class="n">Komanda</td><td></td><td>${sum('Points')}</td><td>${sum('TotalRebounds')}</td><td>${sum('Assistances')}</td><td>${sum('Valuation')}</td><td></td></tr>
  </tbody></table></div>
  <div class="hint">FPTS = PIR × ${mult}${b.live ? ' (pagal dabartinį rezultatą)' : ''} · * – startinis penketas${b.live ? ' · <span class="pd"></span>aikštėje' : ''} · <span style="color:var(--accent)">oranžiniai</span> – tavo komandoje · paspausk žaidėją – daugiau</div>`;
}

async function preGameTable(club){
  // sezono vidurkiai iš ankstesnių turų
  const rounds = []; for(let r = 1; r < viewRound; r++) rounds.push(r);
  await Promise.all(rounds.map(loadRound));
  const gs = rounds.map(r => gameFor(club, r)).filter(g => g && g.played);
  const boxes = await Promise.all(gs.map(g => loadBox(g.code).catch(() => null)));
  const agg = {};
  boxes.forEach((b, i) => {
    if(!b) return;
    const g = gs[i];
    const my = b.codeA === club ? b.sA : b.sB, their = b.codeA === club ? b.sB : b.sA;
    const mult = my > their ? 1.1 : 0.9;
    for(const [code, p] of Object.entries(b.players)){
      if(String(p.Team || '').trim() !== club) continue;
      const a = agg[code] = agg[code] || {code, name: p.Player, dorsal: p.Dorsal, gp: 0, min: 0, pts: 0, reb: 0, ast: 0, pir: 0, fp: 0};
      if(toMinN(p.Minutes) <= 0) continue;
      a.gp++; a.min += toMinN(p.Minutes); a.pts += +p.Points || 0; a.reb += +p.TotalRebounds || 0; a.ast += +p.Assistances || 0;
      a.pir += +p.Valuation || 0; a.fp += (+p.Valuation || 0) * mult;
    }
  });
  // pridėti dabartinį sąrašą be sužaistų rungtynių
  for(const [code, P] of Object.entries(people)) if(P.club === club && !agg[code]) agg[code] = {code, name: P.name, dorsal: P.dorsal, gp: 0};
  const mine = new Set(roster.map(p => p.c));
  const rows = Object.values(agg).filter(a => people[a.code]?.club === club || a.gp)
    .sort((a, c) => (c.gp ? c.fp / c.gp : -99) - (a.gp ? a.fp / a.gp : -99));
  if(!rows.length) return '<div class="status">Duomenų nėra.</div>';
  const f1 = v => v.toFixed(1).replace('.', ',');
  return `<div class="tblwrap"><table class="bx"><thead><tr><th>Žaidėjas</th><th>G</th><th>MIN</th><th>PTS</th><th>REB</th><th>PIR</th><th>FPTS</th></tr></thead><tbody>
    ${rows.map(a => !a.gp ? `<tr class="dnp ${mine.has(a.code) ? 'mine' : ''}" data-code="${a.code}"><td class="n"><small>${esc(a.dorsal || '')}</small>${esc(niceName(a.name))}</td><td>0</td><td colspan="5" style="text-align:center">–</td></tr>` :
      `<tr class="${mine.has(a.code) ? 'mine' : ''}" data-code="${a.code}"><td class="n"><small>${esc(a.dorsal || '')}</small><b>${esc(niceName(a.name))}</b></td><td>${a.gp}</td><td>${f1(a.min / a.gp)}</td><td>${f1(a.pts / a.gp)}</td><td>${f1(a.reb / a.gp)}</td><td>${f1(a.pir / a.gp)}</td><td><b>${f1(a.fp / a.gp)}</b></td></tr>`).join('')}
  </tbody></table></div>
  <div class="hint">Rungtynės dar neprasidėjo – rodomi sezono vidurkiai (${gs.length} rungt.) · <span style="color:var(--accent)">oranžiniai</span> – tavo komandoje</div>`;
}

// ---------- komandos importas iš ekrano nuotraukos (OCR) ----------
const FT2EL = {OLY:'OLY',HTA:'HTA',ZAL:'ZAL',EFS:'IST',CZV:'RED',PBB:'PRS',DUB:'DUB',PAR:'PAR',FEN:'ULK',BAY:'MUN',BAR:'BAR',
  VAL:'PAM',RMB:'MAD',EA7:'MIL',MTA:'TEL',BKN:'BAS',PAO:'PAN',ASV:'ASV',BJK:'BES',VIRT:'VIR',VIR:'VIR'};
const U = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase();
function lev(a, b){
  const m = a.length, n = b.length; if(!m) return n; if(!n) return m;
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let k = 1; k <= n; k++) cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + (a[i - 1] === b[k - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function loadScript(src){
  return new Promise((ok, bad) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = () => bad(new Error('Nepavyko įkelti ' + src)); document.head.appendChild(sc); });
}
async function prepCanvas(file){
  const img = await createImageBitmap(file);
  const scale = img.width < 2200 ? Math.min(3, 2200 / img.width) : 1;
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high'; ctx.drawImage(img, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height), a = d.data;
  for(let i = 0; i < a.length; i += 4){
    const g = 0.299 * a[i] + 0.587 * a[i + 1] + 0.114 * a[i + 2];
    let v = 255 - g;                       // tamsus fonas -> šviesus
    v = v > 150 ? 255 : v < 90 ? 0 : (v - 90) * 255 / 60;   // kontrastas
    a[i] = a[i + 1] = a[i + 2] = v;
  }
  ctx.putImageData(d, 0, 0);
  return c;
}
async function ocrRoster(file, onProgress){
  if(!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const canvas = await prepCanvas(file);
  const worker = await Tesseract.createWorker('eng', 1, {logger: m => { if(m.status === 'recognizing text') onProgress(m.progress); }});
  const {data} = await worker.recognize(canvas);
  await worker.terminate();
  const words = (data.words || []).map(w => ({t: w.text, x0: w.bbox.x0, y0: w.bbox.y0, x1: w.bbox.x1, y1: w.bbox.y1})).filter(w => w.t && w.t.trim());
  const hs = words.map(w => w.y1 - w.y0).sort((a, b) => a - b);
  const H = Math.max(8, hs[Math.floor(hs.length / 2)] || 12); // tipinis teksto aukštis
  const DIG = {'0':'O','1':'I','2':'Z','4':'A','5':'S','6':'G','7':'T','8':'B'};
  // žaidėjų indeksas pagal pavardę
  const idx = Object.entries(people).map(([c, p]) => {
    const [last, first] = p.name.split(',');
    return {c, club: p.club, ini: U(first || '').trim()[0] || '', last: U(last).replace(/[^A-Z]/g, '')};
  });
  function match(tries, ini){
    let best = [], bestD = 99;
    for(const p of idx){
      if(ini && p.ini && p.ini !== ini) continue;
      for(const s of tries){
        const tol = ini ? Math.max(1, Math.floor(p.last.length / 4)) : (p.last.length >= 7 ? 1 : 0);
        const d = lev(s, p.last);
        if(d <= tol && d < bestD){ bestD = d; best = [p]; }
        else if(d <= tol && d === bestD && !best.includes(p)) best.push(p);
      }
    }
    return best;
  }
  function teamBelow(box){
    for(const w of words){
      if(w.y0 > box.y0 + H * 0.5 && w.y0 < box.y1 + H * 3 && w.x1 > box.x0 - H * 4 && w.x0 < box.x1 + H * 4){
        const k = U(w.t).replace(/[^A-Z0-9]/g, ''); if(FT2EL[k]) return FT2EL[k];
      }
    }
    return null;
  }
  const cands = [], used = new Set();
  function add(best, box, i0, i1){
    if(!best.length) return;
    const team = teamBelow(box);
    if(best.length > 1){
      const byTeam = team ? best.filter(p => p.club === team) : [];
      const inRoster = best.filter(p => roster.some(r => r.c === p.c));
      best = byTeam.length === 1 ? byTeam : inRoster.length === 1 ? inRoster : [];
      if(!best.length) return;
    }
    cands.push({code: best[0].c, role: 's', box, y: box.y0, x: box.x0});
    for(let k = i0; k <= i1; k++) used.add(k);
  }
  // 1) „C. Jones“ tipo vardai
  for(let i = 0; i < words.length; i++){
    let t = U(words[i].t).replace(/[|]/g, '');
    if(DIG[t[0]] && /^[0-9][.,]/.test(t)) t = DIG[t[0]] + t.slice(1);
    const m = t.match(/^([A-Z])[.,]([A-Z][A-Z'\-]*)?$/);
    if(!m) continue;
    const parts = m[2] ? [m[2]] : [];
    let x1 = words[i].x1, j = i + 1;
    for(; j < words.length && parts.length < 3; j++){
      const w = words[j];
      if(Math.abs(w.y0 - words[i].y0) > H || w.x0 < x1 - 5 || w.x0 - x1 > H * 2.5) break;
      if(!/^[A-ZÀ-Ž]/.test(w.t)) break;            // „vs“, „@“ ir pan. – ne pavardės dalis
      const ww = U(w.t).replace(/[^A-Z'\-]/g, ''); if(!ww) break;
      parts.push(ww); x1 = w.x1;
    }
    if(!parts.length) continue;
    const nameX1 = m[2] ? words[i].x1 : (words[i + 1]?.x1 ?? words[i].x1);
    const tries = [parts[0], parts.slice(0, 2).join(''), parts.slice(0, 3).join('')].map(x => x.replace(/[^A-Z]/g, '')).filter(x => x.length >= 2);
    add(match(tries, m[1]), {x0: words[i].x0, y0: words[i].y0, x1: nameX1, y1: words[i].y1}, i, j - 1);
  }
  // 2) atsarginis variantas: pavardė be inicialo (pvz., inicialas neatpažintas)
  for(let i = 0; i < words.length; i++){
    if(used.has(i)) continue;
    const raw = words[i].t.replace(/^[^A-Za-zÀ-ž]+|[^A-Za-zÀ-ž'\-]+$/g, '');
    if(raw.length < 4 || !/^[A-ZÀ-Ž]/.test(raw)) continue;
    const t = U(raw).replace(/[^A-Z]/g, '');
    const w = words[i];
    add(match([t], null), {x0: w.x0, y0: w.y0, x1: w.x1, y1: w.y1}, i, i);
  }
  // suolas: kiekvieną „100%/50% PTS“ žymą priskiriam artimiausiam vardui kairėje (aikštelės kortelėse procentų nėra)
  const isTag = w => /%/.test(w.t) || /^[PRF]?[TI7]S\.?$/i.test(w.t.replace(/[^A-Za-z0-9.]/g, '')) && !/^FPTS/i.test(w.t);
  for(const w of words){
    if(!isTag(w)) continue;
    let best = null, bd = Infinity;
    const wcx = (w.x0 + w.x1) / 2;
    for(const c of cands){
      const dy = w.y0 - c.box.y0, ccx = (c.box.x0 + c.box.x1) / 2;
      let d = Infinity;
      // a) sąrašo vaizdas: žyma dešinėje nuo vardo
      if(c.box.x1 <= w.x0 && dy >= -H && dy <= H * 5) d = (w.x0 - c.box.x1) + Math.abs(dy) * 3;
      // b) kortelių vaizdas (telefonas): žyma po vardu, kortelės apačioje
      if(dy > H * 0.5 && dy < H * 13 && Math.abs(wcx - ccx) < H * 4) d = Math.min(d, dy + Math.abs(wcx - ccx) * 2);
      if(d < bd){ bd = d; best = c; }
    }
    const left = words.filter(z => Math.abs(z.y0 - w.y0) < H && z.x1 <= w.x0 + 2 && w.x0 - z.x1 < H * 3).map(z => z.t).join('') + w.t;
    if(best) best.role = /1[0O]{2}/.test(left) ? 'x' : (best.role === 'x' ? 'x' : 'b');
  }
  // dublikatai
  const seen = new Set(), out = [];
  for(const c of cands.sort((a, b) => a.y - b.y || a.x - b.x)) if(!seen.has(c.code)){ seen.add(c.code); out.push(c); }
  // atsarginis variantas: jei suolo žymos neatpažintos – suolas yra apatinė 5 kortelių eilė
  const nS = out.filter(c => c.role === 's').length;
  if(out.length === 10 && nS !== 5){
    const byY = out.slice().sort((a, b) => a.y - b.y), low = byY.slice(5);
    if(low[4].y - low[0].y < H * 2.5){
      const sixth = low.find(c => c.role === 'x') || low.slice().sort((a, b) => a.x - b.x)[0];
      for(const c of out) c.role = low.includes(c) ? (c === sixth ? 'x' : 'b') : 's';
    }
  }
  // lygiai vienas 6-as
  const xs = out.filter(c => c.role === 'x');
  if(xs.length > 1) xs.slice(1).forEach(c => c.role = 'b');
  if(!xs.length && out.filter(c => c.role === 'b').length === 5) out.filter(c => c.role === 'b').sort((a, b) => a.y - b.y || a.x - b.x)[0].role = 'x';
  return out;
}

// ---------- settings ----------
function openSettings(){
  let draft = roster.map(p => ({...p}));
  const list = Object.entries(people).map(([c, p]) => ({c, ...p})).sort((a, b) => a.name.localeCompare(b.name));
  function rowsHtml(){
    return draft.map((p, i) => {
      const P = people[p.c] || {name: p.c, club: '', pos: ''};
      return `<div class="row ${p.isNew ? 'new' : ''}">
        <div class="nm search">${esc(fullName(P.name))}<small>${esc(P.club)} · ${esc(P.pos)} · <a href="#" data-repl="${i}" style="color:var(--teal)">keisti</a></small>
          <input class="repl" data-ri="${i}" placeholder="Ieškoti žaidėjo…"><div class="sres" data-sr="${i}"></div></div>
        <select data-i="${i}"><option value="s" ${p.r === 's' ? 'selected' : ''}>Startas</option><option value="x" ${p.r === 'x' ? 'selected' : ''}>6-as</option><option value="b" ${p.r === 'b' ? 'selected' : ''}>Suolas</option></select>
        <button class="capbtn ${p.cap ? 'on' : ''}" data-cap="${i}" title="Kapitonas">C</button>
      </div>`;
    }).join('');
  }
  function draw(msg = ''){
    $('#setRows').innerHTML = rowsHtml();
    $('#setMsg').textContent = msg;
    document.querySelectorAll('#setRows select').forEach(s => s.onchange = () => { draft[+s.dataset.i].r = s.value; if(s.value !== 's') draft[+s.dataset.i].cap = 0; draw(); });
    document.querySelectorAll('#setRows [data-cap]').forEach(b => b.onclick = () => { const i = +b.dataset.cap; if(draft[i].r !== 's'){ draw('Kapitonas turi būti starte.'); return; } draft.forEach((p, k) => p.cap = k === i ? 1 : 0); draw(); });
    document.querySelectorAll('#setRows [data-repl]').forEach(a => a.onclick = e => { e.preventDefault(); const i = a.dataset.repl; const inp = document.querySelector(`[data-ri="${i}"]`); inp.style.display = 'block'; inp.focus(); });
    document.querySelectorAll('#setRows .repl').forEach(inp => inp.oninput = () => {
      const i = +inp.dataset.ri, q = inp.value.trim().toLowerCase(), box = document.querySelector(`[data-sr="${i}"]`);
      if(q.length < 2){ box.style.display = 'none'; return; }
      const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
      const hits = list.filter(p => norm(p.name).includes(norm(q))).slice(0, 12);
      box.innerHTML = hits.map(h => `<button data-pick="${h.c}">${esc(fullName(h.name))} <small>${esc(h.club)} · ${esc(h.pos)}</small></button>`).join('') || '<div class="status">Nerasta</div>';
      box.style.display = 'block';
      box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { draft[i].c = b.dataset.pick; draw(); });
    });
  }
  openSheet(`<div class="hd"><div><h2>Mano komanda</h2><p>Pažymėk startą, 6-ąjį ir kapitoną. Sudėtis saugoma šiame įrenginyje ir nuorodoje.</p></div><button class="close" aria-label="Uždaryti">✕</button></div>
    <div class="sec set">
      <div class="imp"><button class="btn ghost" id="impBtn">📷 Įkelti iš ekrano nuotraukos</button><input type="file" id="impFile" accept="image/*" hidden>
        <p>Nufotografuok (screenshot) savo komandą BasketNews Fantasy puslapyje ir įkelk – žaidėjai, startas ir suolas bus atpažinti automatiškai. Kapitoną pažymėk pats (C).</p>
        <div class="bar" id="impBar"><i></i></div></div>
      <div id="setRows"></div><div class="msg" id="setMsg"></div>
    <div class="actions"><button class="btn" id="setSave">Išsaugoti</button><button class="btn ghost" id="setLink">Kopijuoti nuorodą</button><button class="btn ghost" id="setReset">Atstatyti</button></div></div>`);
  $('#sheet .close').onclick = closeSheet;
  draw();
  $('#impBtn').onclick = () => $('#impFile').click();
  $('#impFile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    const bar = $('#impBar'), fill = bar.querySelector('i');
    bar.style.display = 'block'; fill.style.width = '3%'; draw('Atpažįstama nuotrauka… (pirmą kartą užtrunka ~10–20 s)');
    try{
      const found = await ocrRoster(f, p => { fill.style.width = Math.max(3, Math.round(p * 100)) + '%'; });
      if(!found.length){ draw('Nepavyko atpažinti žaidėjų. Pabandyk aiškesnę nuotrauką (visas komandos vaizdas su suolu).'); return; }
      const prevCap = draft.find(p => p.cap)?.c;
      let next = found.slice(0, 10).map(f => ({c: f.code, r: f.role, cap: 0, isNew: 1}));
      // jei atpažinta mažiau nei 10 – papildom esamais žaidėjais
      for(const p of draft){ if(next.length >= 10) break; if(!next.some(n => n.c === p.c)) next.push({...p, cap: 0, isNew: 0}); }
      const cap = next.find(p => p.c === prevCap && p.r === 's'); if(cap) cap.cap = 1;
      draft = next;
      const s = draft.filter(p => p.r === 's').length, x = draft.filter(p => p.r === 'x').length;
      draw(`Atpažinta ${found.length} iš 10. Startas: ${s}, 6-as: ${x}. ${found.length < 10 ? 'Trūkstamus pakeisk ranka („keisti“). ' : ''}Patikrink, pažymėk kapitoną ir spausk „Išsaugoti“.`);
    }catch(err){ draw('Klaida atpažįstant: ' + err.message); }
    finally{ bar.style.display = 'none'; e.target.value = ''; }
  };
  $('#setSave').onclick = () => {
    const bad = rosterIssue(draft); if(bad) return draw(bad);
    roster = draft.map(({c, r, cap}) => ({c, r, cap: cap ? 1 : 0})); saveRoster(roster); closeSheet(); refresh(true);
  };
  $('#setLink').onclick = async () => {
    const bad = rosterIssue(draft); if(bad) return draw(bad + ' Pirma pataisyk sudėtį.');
    roster = draft.map(({c, r, cap}) => ({c, r, cap: cap ? 1 : 0})); saveRoster(roster, true); render();
    try{ await navigator.clipboard.writeText(location.href); draw('Nuoroda nukopijuota – atsidaryk ją telefone ir išsisaugok žymą.'); }
    catch(e){ draw('Nuoroda: ' + location.href); }
  };
  $('#setReset').onclick = () => { draft = DEFAULT.map(p => ({...p, cap: p.cap ? 1 : 0})); draw('Atstatyta numatytoji sudėtis (dar neišsaugota).'); };
}
$('#setBtn').onclick = () => { if(Object.keys(people).length) openSettings(); };

// ---------- refresh loop ----------
async function refresh(force){
  try{
    const games = await loadRound(viewRound);
    const need = games.filter(g => g.played || Date.parse(g.utc) - Date.now() < 15 * 60e3);
    await Promise.all(need.map(g => loadBox(g.code, force)));
    // refresh round list scores occasionally
    lastUpdate = new Date();
    render();
    if(openGameCode != null && $('#sheet').classList.contains('on')) openGame(openGameCode, true);
  }catch(e){
    $('#foot').innerHTML = '<span class="err">Nepavyko atnaujinti: ' + esc(e.message) + '</span>';
  }
  clearTimeout(timer);
  const anyLive = Object.values(boxCache).some(b => b.live);
  timer = setTimeout(() => refresh(false), anyLive ? 30000 : 180000);
}
$('#prevR').onclick = async () => { if(viewRound > 1){ viewRound--; render(); refresh(false); } };
$('#nextR').onclick = async () => { viewRound++; roundGames[viewRound] = undefined; await loadRound(viewRound); render(); refresh(false); };
window.addEventListener('hashchange', () => location.reload());
document.addEventListener('visibilitychange', () => { if(!document.hidden) refresh(true); });
$('#refBtn').onclick = async () => {
  const ic = $('#refBtn span'); if(ic.classList.contains('spin')) return;
  ic.classList.add('spin');
  try{
    // pilnas perkrovimas: išvalom podėlį, kad būtų imami švieži duomenys
    for(const k in boxCache) if(!boxCache[k].final) delete boxCache[k];
    roundGames[viewRound] = undefined; await loadRound(viewRound);
    await refresh(true);
  } finally { ic.classList.remove('spin'); }
};

(async function init(){
  try{
    await loadPeople();
    curRound = await findCurrentRound();
    viewRound = curRound;
    render();
    await refresh(true);
  }catch(e){
    $('#games').innerHTML = '<div class="status err">Nepavyko pasiekti EuroLeague duomenų (' + esc(e.message) + ').<br>Dažniausia priežastis – reklamų blokatorius ar kitas naršyklės plėtinys, arba darbo tinklo filtras. Pabandyk išjungti blokatorių šiam puslapiui arba atsidaryk telefone.<br><br><button class="btn" onclick="location.reload()">Bandyti dar kartą</button></div>';
  }
})();
})();
</script>
